<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Окно в мир</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: night-flight theme. Hero globe + sticky explorer globe; one city selection drives a boarding-pass panel with tabs */
:root{--sky:#08132b;--sky2:#0f2147;--panel:#13285a;--line:#24407a;--fg:#eef3ff;--muted:#9fb3dd;--amber:#ffb547;--coral:#ff6b5b;--teal:#4fd1c5;--land:#2c5a8c;
--display:"Unbounded","Arial Black",sans-serif;--body:"Golos Text",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--sky);color:var(--fg);font:16px/1.55 var(--body);overflow-x:hidden}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:clamp(26px,4.4vw,44px);font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
.eyebrow{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
.lead{color:var(--muted);max-width:60ch;margin-top:14px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.btn{font:600 16px var(--body);border:0;border-radius:999px;padding:15px 28px;background:var(--amber);color:#1a1200;box-shadow:0 0 0 0 rgba(255,181,71,.6);animation:pulse 2.4s infinite;transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(255,181,71,0)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0)}}
section{padding-block:80px;position:relative}
/* HERO */
.hero{min-height:min(860px,100svh);display:grid;place-items:center;position:relative;overflow:hidden;padding-block:40px}
#stars{position:absolute;inset:0;width:100%;height:100%}
.hgrid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;width:100%}
.hero h1{font-size:clamp(46px,9vw,112px);font-weight:800;letter-spacing:-.03em}
.hero h1 .l{display:inline-block;animation:drop .9s cubic-bezier(.2,.9,.3,1.3) both}
.hero h1 .w2{color:var(--amber)}
@keyframes drop{from{transform:translateY(-60px) rotate(-8deg);opacity:0}}
.sub{font-size:clamp(17px,2vw,21px);color:var(--muted);margin-top:18px;max-width:30ch;animation:fade 1s .9s both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
.subjects{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 30px;animation:fade 1s 1.1s both}
.subjects span{border:1px solid var(--line);background:rgba(19,40,90,.6);backdrop-filter:blur(6px);border-radius:999px;padding:7px 14px;font-size:14px}
.subjects b{color:var(--teal)}
.globe{width:100%;max-width:560px;justify-self:center;aspect-ratio:1;filter:drop-shadow(0 0 50px rgba(79,160,255,.35));touch-action:none;cursor:grab}
.globe:active{cursor:grabbing}#g2{border-radius:32px;overflow:hidden}
.grat{fill:none;stroke:rgba(159,179,221,.14);stroke-width:.6}
.landp{fill:var(--land);stroke:rgba(255,255,255,.18);stroke-width:.4}
.arc{fill:none;stroke:var(--amber);stroke-width:1.4;stroke-dasharray:4 6;opacity:.75;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.arc.on{stroke:var(--coral);stroke-width:3;stroke-dasharray:none;opacity:1;animation:none}
.cdot{fill:var(--teal);stroke:var(--sky);stroke-width:2;cursor:pointer;transition:r .2s}
.cdot:hover{r:9}
.cdot.on{fill:var(--coral)}
.clbl{font:600 13px var(--body);fill:var(--fg);paint-order:stroke;stroke:var(--sky);stroke-width:4px;pointer-events:none}
.ala{fill:var(--amber)}
.ring{fill:none;stroke:var(--amber);stroke-width:2;animation:ring 2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
.scroll{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font:500 12px var(--mono);color:var(--muted);letter-spacing:.14em;animation:bob 2s infinite}
@keyframes bob{50%{transform:translate(-50%,6px)}}
/* EXPLORER */
.exp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:32px;align-items:start;margin-top:36px}
.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{border:1px solid var(--line);background:var(--sky2);color:var(--fg);border-radius:999px;padding:9px 16px;font:500 14px var(--body);transition:all .25s}
.chip:hover{border-color:var(--teal);transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff}
.flightbar{margin-top:14px;height:6px;border-radius:3px;background:var(--sky2);overflow:hidden}
.flightbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--coral))}
.hintg{font-size:13px;color:var(--muted);margin-top:10px}
/* boarding pass */
.pass{background:var(--panel);border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);transform-style:preserve-3d;transition:transform .2s}
.pass.enter{animation:passin .7s cubic-bezier(.2,.9,.3,1.1)}
@keyframes passin{from{transform:translateY(40px) rotateX(18deg);opacity:0}}
.ptop{background:var(--amber);color:#1a1200;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ptop small{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.75;display:block}
.codes{display:flex;align-items:center;gap:14px;font:800 clamp(26px,4vw,40px) var(--display)}
.codes .pl{font-size:22px;animation:fly 1.6s ease-in-out infinite}
@keyframes fly{50%{transform:translateX(6px)}}
.pinfo{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:2px dashed var(--line)}
.pinfo div{background:var(--panel);padding:14px 16px;min-width:0}
.pinfo small{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block}
.pinfo b{font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;padding:12px 16px 0;overflow-x:auto}
.tab{background:none;border:0;color:var(--muted);font:600 14px var(--body);padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--coral)}
.tbody{padding:20px 24px 26px;min-height:340px}
.tbody>div{animation:fade .45s both}
.tbody h3{margin:16px 0 6px}.tbody h3:first-child{margin-top:0}
.tbody p,.tbody li{color:var(--muted)}
.tbody ul{margin:0;padding-left:18px}
.badge{display:inline-block;font:500 12px var(--mono);padding:5px 10px;border-radius:999px;background:var(--teal);color:#062421;margin-bottom:10px}
.badge.warn{background:var(--sky2);color:var(--muted);border:1px solid var(--line)}
/* compare */
.crow{margin-bottom:18px}.crow small{font-size:13px;color:var(--muted)}
.bar{display:grid;grid-template-columns:84px 1fr 96px;gap:10px;align-items:center;font-size:14px;margin-top:5px}
.bar i{display:block;height:14px;border-radius:7px;background:var(--teal);width:0;transition:width 1.1s cubic-bezier(.2,.9,.3,1)}
.bar.a i{background:var(--amber)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.vs div{background:var(--sky2);border-radius:12px;padding:12px}
.vs small{font:500 11px var(--mono);color:var(--amber);letter-spacing:.1em;text-transform:uppercase}
/* route */
.steps{list-style:none;padding:0;margin:0;position:relative}
.steps li{padding:0 0 18px 30px;position:relative;opacity:.25;transition:opacity .4s,transform .4s;transform:translateX(-6px)}
.steps li.v{opacity:1;transform:none}
.steps li::before{content:"";position:absolute;left:6px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--sky);border:2px solid var(--amber)}
.steps li.v::before{background:var(--amber)}
.steps li::after{content:"";position:absolute;left:12px;top:20px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.big{font:800 clamp(34px,5vw,52px) var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
/* phrases */
.flips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.flip{perspective:900px;height:150px;background:none;border:0;padding:0;color:inherit;text-align:left}
.fi{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.f .fi{transform:rotateY(180deg)}
.fs{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--sky2);border:1px solid var(--line)}
.fs.b{transform:rotateY(180deg);background:var(--teal);color:#062421;border:0}
.fs small{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.fs .o{font-size:21px;font-weight:600;overflow-wrap:anywhere;line-height:1.2}
.fs .t{font-size:19px;font-weight:600}
.say{margin-top:auto;align-self:flex-start;border:0;border-radius:999px;padding:7px 14px;background:#062421;color:var(--teal);font:600 13px var(--body)}
.fs .tap{margin-top:auto;font-size:12px;color:var(--muted)}
#tts{font-size:13px;color:var(--muted);margin-top:10px;min-height:1em}
/* idea */
.isteps{display:grid;gap:10px}
.istep{display:grid;grid-template-columns:40px 1fr;gap:12px;background:var(--sky2);border-radius:14px;padding:14px;animation:fade .5s both}
.istep b{font:800 20px var(--display);color:var(--amber)}
.istep small{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:2px}
.istep p{color:var(--fg)!important}
/* quiz */
.quiz{max-width:760px;margin:32px auto 0;background:var(--panel);border-radius:24px;padding:28px;position:relative;overflow:hidden}
.qprog{height:6px;background:var(--sky2);border-radius:3px;overflow:hidden;margin-bottom:18px}.qprog i{display:block;height:100%;background:var(--teal);transition:width .4s}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{text-align:left;font:500 16px var(--body);border:1px solid var(--line);background:var(--sky2);color:var(--fg);border-radius:14px;padding:14px 16px;transition:transform .15s,background .2s}
.opt:hover:not(:disabled){transform:translateX(6px);border-color:var(--teal)}
.opt.ok{background:var(--teal);color:#062421;border-color:var(--teal)}
.opt.no{background:var(--coral);border-color:var(--coral);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.qmeta{font:500 12px var(--mono);color:var(--muted);letter-spacing:.1em}
#conf{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.score{font:800 clamp(56px,10vw,96px) var(--display);color:var(--amber)}
/* lower */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}
.card{background:var(--panel);border-radius:18px;padding:22px;transition:transform .3s;min-width:0}
.card:hover{transform:translateY(-6px)}
.card p,.card li{color:var(--muted)}.card ul{margin:8px 0 0;padding-left:18px}
.card h3{margin-bottom:8px}
.survey{margin-top:24px;border:2px dashed var(--line);border-radius:20px;padding:24px}
.survey .bar i{background:var(--line);width:8%}
.who{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:28px}
.who div{background:var(--panel);border-radius:18px;padding:20px 16px;text-align:center;transition:transform .3s,background .3s}
.who div:hover{transform:translateY(-8px) rotate(-2deg);background:var(--line)}
.who b{display:block;font:800 30px var(--display);color:var(--amber)}
.qrw{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;background:linear-gradient(120deg,var(--panel),var(--sky2));border-radius:28px;padding:36px}
.qrbox{width:190px;aspect-ratio:1;border:3px dashed var(--amber);border-radius:20px;display:grid;place-items:center;text-align:center;color:var(--amber);font:500 13px var(--mono);padding:14px;max-width:100%;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
.src{margin:20px 0 0;padding-left:20px;display:grid;gap:10px;color:var(--muted)}
.src a{color:var(--teal);overflow-wrap:anywhere}
footer{padding-block:30px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.rv{transition:opacity .8s,transform .8s}
.rv.pre{opacity:0;transform:translateY(40px)}
@media (max-width:900px){.hgrid,.exp,.qrw,.cards3{grid-template-columns:1fr}.stick{position:static}.who{grid-template-columns:repeat(2,1fr)}.globe{max-width:420px}.hero{min-height:auto}}
@media (max-width:520px){.pinfo{grid-template-columns:1fr 1fr}.flips,.vs{grid-template-columns:1fr}.bar{grid-template-columns:70px 1fr 84px}.tbody{padding:18px 16px}.quiz{padding:20px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<style>
.lp{position:fixed;inset:0;z-index:50;background:rgba(8,19,43,.94);backdrop-filter:blur(8px);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fade .5s both}
.lp[hidden]{display:none}
.lp-box{text-align:center;display:grid;gap:28px;max-width:720px}
.lp-box h2{font-size:clamp(28px,5vw,48px)}
.lp-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.lp-btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:22px;padding:24px 28px;min-width:190px;font:600 22px var(--body);transition:transform .25s,border-color .25s}
.lp-btn:hover{border-color:var(--amber);transform:translateY(-5px)}
.lp-btn small{display:block;font:500 12px var(--mono);color:var(--muted);margin-top:8px;letter-spacing:.08em}
.lsw{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(14px,env(safe-area-inset-right,0px));z-index:40;display:flex;background:rgba(19,40,90,.88);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:4px}
.lsw button{border:0;background:none;color:var(--muted);font:600 13px var(--mono);padding:8px 12px;border-radius:999px}
.lsw button[aria-pressed="true"]{background:var(--amber);color:#1a1200}
.concl{margin-top:20px;background:var(--panel);border-left:4px solid var(--amber);border-radius:12px;padding:16px 18px;font-size:17px}
.survey .bar i{background:var(--amber)}
.phs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0 14px}
.ph{margin:0;border-radius:12px;overflow:hidden;background:var(--sky2)}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .6s}
.ph:hover img{transform:scale(1.07)}
.ph figcaption{font-size:12px;color:var(--muted);padding:6px 9px}
</style>

<div class="lp" id="lp" role="dialog" aria-label="Тілді таңдаңыз / Выберите язык / Choisissez la langue">
  <div class="lp-box">
    <div class="eyebrow">ALA → 🌍</div>
    <h2>Әлемге терезе · Окно в мир · Fenêtre sur le monde</h2>
    <p class="lead" style="margin:0 auto">Тілді таңдаңыз · Выберите язык · Choisissez la langue</p>
    <div class="lp-btns">
      <button class="lp-btn" data-pick="kz">Қазақша<small>KZ</small></button>
      <button class="lp-btn" data-pick="ru">Русский<small>RU</small></button>
      <button class="lp-btn" data-pick="fr">Français<small>FR</small></button>
    </div>
  </div>
</div>
<div class="lsw" role="group" aria-label="Language"><button data-sw="kz">KZ</button><button data-sw="ru">RU</button><button data-sw="fr">FR</button></div>

<header class="hero pad">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="wrap hgrid">
    <div>
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1 id="title"></h1>
      <p class="sub" data-i="sub"></p>
      <div class="subjects"><span data-i="s1"></span><span data-i="s2"></span><span data-i="s3"></span></div>
      <button class="btn" id="go" data-i="go"></button>
    </div>
    <svg class="globe" id="g1" viewBox="0 0 600 600" role="img" aria-label="Globe"></svg>
  </div>
  <div class="scroll" data-i="scroll"></div>
</header>

<section id="explore" class="pad">
  <div class="wrap">
    <div class="eyebrow rv" data-i="expEye"></div>
    <h2 class="rv" data-i="expH"></h2>
    <p class="lead rv" data-i="expLead"></p>
    <div class="exp">
      <div class="stick">
        <svg class="globe" id="g2" viewBox="0 0 600 600" role="img" aria-label="Globe"></svg>
        <div class="chips" id="chips"></div>
        <div class="flightbar"><i id="fbar"></i></div>
        <p class="hintg" data-i="hint"></p>
      </div>
      <div class="pass" id="pass">
        <div class="ptop"><div><small data-i="passT"></small><div class="codes"><span>ALA</span><span class="pl">✈</span><span id="p-code"></span></div></div><div style="text-align:right"><small data-i="dest"></small><b id="p-city" style="font:800 20px var(--display)"></b><small id="p-country" style="opacity:.8"></small></div></div>
        <div class="pinfo"><div><small data-i="pDist"></small><b id="p-km"></b></div><div><small data-i="pTime"></small><b id="p-time"></b></div><div><small data-i="pPop"></small><b id="p-pop"></b></div><div><small data-i="pLang"></small><b id="p-lang"></b></div></div>
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="tbody" id="tbody"></div>
      </div>
    </div>
    <p class="hintg" data-i="foot"></p>
  </div>
</section>

<section id="quiz-s" class="pad">
  <div class="wrap">
    <div class="eyebrow rv" style="text-align:center" data-i="qEye"></div>
    <h2 class="rv" style="text-align:center" data-i="qH"></h2>
    <div class="quiz rv" id="quiz"></div>
  </div>
</section>

<section class="pad">
  <div class="wrap">
    <div class="eyebrow rv" data-i="resEye"></div>
    <h2 class="rv" data-i="resH"></h2>
    <div class="cards3">
      <div class="card rv"><h3 data-i="c1h"></h3><p data-i="c1"></p></div>
      <div class="card rv"><h3 data-i="c2h"></h3><ul data-il="c2"></ul></div>
      <div class="card rv"><h3 data-i="c3h"></h3><ul data-il="c3"></ul></div>
    </div>
    <div class="survey rv">
      <div class="eyebrow" data-i="svEye"></div>
      <h3 data-i="svH"></h3>
      <p class="lead" data-i="svNote"></p>
      <div style="margin-top:16px" id="survey"></div>
      <p class="concl" data-i="svConcl"></p>
    </div>
  </div>
</section>

<section class="pad">
  <div class="wrap">
    <div class="eyebrow rv" data-i="valEye"></div>
    <h2 class="rv" data-i="valH"></h2>
    <div class="who" id="who"></div>
    <p class="lead rv" data-i="valLead"></p>
  </div>
</section>

function dist(a,b){const d=Math.sin(rad(b.lat-a.lat)/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(rad(b.lon-a.lon)/2)**2;return 2*6371*Math.asin(Math.sqrt(d))}
C.forEach(c=>c.km=Math.round(dist(ALA,c)));
const land=topojson.feature(LAND_TOPO,LAND_TOPO.objects.land);
const A=[ALA.lon,ALA.lat];

/* stars */
{const cv=$("#stars"),x=cv.getContext("2d");let W,H,S=[],mx=0,my=0,shoot=null;
function size(){W=cv.width=cv.offsetWidth*devicePixelRatio;H=cv.height=cv.offsetHeight*devicePixelRatio;S=d3.range(220).map(()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,d:Math.random()*.8+.2,p:Math.random()*6}))}
size();addEventListener("resize",size);addEventListener("mousemove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function f(t){x.clearRect(0,0,W,H);S.forEach(s=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));x.fillStyle="#fff";x.beginPath();x.arc(s.x-mx*30*s.d*devicePixelRatio,s.y-my*30*s.d*devicePixelRatio,s.r*devicePixelRatio,0,7);x.fill()});
if(!shoot&&Math.random()<.006)shoot={x:Math.random()*W,y:Math.random()*H*.4,l:0};
if(shoot){shoot.l+=14;x.globalAlpha=1-shoot.l/400;x.strokeStyle="#ffd58a";x.lineWidth=2;x.beginPath();x.moveTo(shoot.x+shoot.l,shoot.y+shoot.l*.4);x.lineTo(shoot.x+shoot.l-60,shoot.y+shoot.l*.4-24);x.stroke();if(shoot.l>400)shoot=null}
x.globalAlpha=1;if(!RM)requestAnimationFrame(f)}requestAnimationFrame(f)}

/* globe */
const PLANE="M0,-10 L2,-3 L10,1 L10,3 L2,1 L1.5,7 L4,9 L4,10.5 L0,9.5 L-4,10.5 L-4,9 L-1.5,7 L-2,1 L-10,3 L-10,1 L-2,-3 Z";
const gline=(c,t=1)=>({type:"LineString",coordinates:d3.range(0,t+1e-9,Math.max(t/60,.005)).map(d3.geoInterpolate(A,[c.lon,c.lat]))});
const OFF={busan:[10,16],bishkek:[-10,4],rennes:[10,4]};
function Globe(id,opt){
  const svg=d3.select(id),R0=270,proj=d3.geoOrthographic().translate([300,300]).scale(R0).clipAngle(90),path=d3.geoPath(proj),gid=id.slice(1);
  const defs=svg.append("defs");const rg=defs.append("radialGradient").attr("id",gid+"s").attr("cx","35%").attr("cy","30%");
  rg.append("stop").attr("offset","0").attr("stop-color","#1d4c8f");rg.append("stop").attr("offset","1").attr("stop-color","#081a3a");
  const sh=defs.append("radialGradient").attr("id",gid+"h").attr("cx","30%").attr("cy","25%");sh.append("stop").attr("offset","0").attr("stop-color","#fff").attr("stop-opacity",.18);sh.append("stop").attr("offset","1").attr("stop-color","#fff").attr("stop-opacity",0);
  const sea=svg.append("circle").attr("cx",300).attr("cy",300).attr("fill",`url(#${gid}s)`);
  const gr=svg.append("path").datum(d3.geoGraticule10()).attr("class","grat");
  const ld=svg.append("path").datum(land).attr("class","landp");
  const arcs=C.map(c=>svg.append("path").datum(gline(c)).attr("class","arc"));
  const live=svg.append("path").attr("class","arc on").attr("fill","none");
  const hl=svg.append("circle").attr("cx",300).attr("cy",300).attr("fill",`url(#${gid}h)`).attr("pointer-events","none");
  const ga=svg.append("g");ga.append("circle").attr("r",8).attr("class","ring");ga.append("circle").attr("r",6).attr("class","ala");const alaT=ga.append("text").attr("class","clbl").attr("y",-14).attr("text-anchor","middle");
  const cs=C.map(c=>{const g=svg.append("g").style("cursor","pointer").attr("tabindex",0).attr("role","button").on("click",e=>{e.stopPropagation();opt.onPick&&opt.onPick(c)}).on("keydown",e=>{if(e.key==="Enter")opt.onPick&&opt.onPick(c)});
    g.append("circle").attr("r",6).attr("class","cdot");g.append("text").attr("class","clbl");return g});
  const plane=svg.append("path").attr("d",PLANE).attr("fill","#fff").attr("opacity",0);
  const dots=opt.traffic?C.map(()=>svg.append("circle").attr("r",3).attr("fill","#ffd58a")):[];
  const st={rot:[-50,-30],k:1,auto:true,sel:null,t:0};
  const vis=p=>d3.geoDistance(p,[-st.rot[0],-st.rot[1]])<Math.PI/2-.02;
  function labels(){alaT.text(T[L].ala);cs.forEach((g,i)=>g.attr("aria-label",tx(C[i]).name).select("text").text(tx(C[i]).name))}
  function render(now){proj.rotate(st.rot).scale(R0*st.k);sea.attr("r",R0*st.k);hl.attr("r",R0*st.k);gr.attr("d",path);ld.attr("d",path);
    arcs.forEach((a,i)=>a.attr("d",path).attr("opacity",st.sel&&st.sel!==C[i]?.15:null));
    live.attr("d",st.sel?path(gline(st.sel,st.t)):null);
    ga.attr("transform",`translate(${proj(A)})`).attr("opacity",vis(A)?1:0);
    cs.forEach((g,i)=>{const c=C[i],o=OFF[c.id]||[10,4],left=o[0]<0&&st.k>2.5;g.attr("transform",`translate(${proj([c.lon,c.lat])})`).attr("opacity",vis([c.lon,c.lat])?1:0).select(".cdot").classed("on",st.sel===c);g.select("text").attr("x",left?-10:Math.abs(o[0])).attr("text-anchor",left?"end":"start").attr("y",o[1])});
    dots.forEach((d,i)=>{const c=C[i],tt=((now||0)/(2600+i*700)+i*.2)%1,q=d3.geoInterpolate(A,[c.lon,c.lat])(tt);d.attr("transform",`translate(${proj(q)})`).attr("opacity",vis(q)&&!st.sel?1:0)});
    if(st.sel&&st.t>0&&st.t<1){const ip=d3.geoInterpolate(A,[st.sel.lon,st.sel.lat]),q=ip(st.t),p1=proj(q),p2=proj(ip(Math.min(1,st.t+.01)));plane.attr("opacity",vis(q)?1:0).attr("transform",`translate(${p1}) rotate(${Math.atan2(p2[1]-p1[1],p2[0]-p1[0])*180/Math.PI+90}) scale(1.3)`)}else plane.attr("opacity",0)}
  svg.call(d3.drag().on("start",()=>{st.auto=false}).on("drag",e=>{st.rot[0]+=e.dx*.35/st.k;st.rot[1]=Math.max(-80,Math.min(80,st.rot[1]-e.dy*.35/st.k));render()}));
  d3.timer(now=>{if(st.auto&&!RM)st.rot[0]-=.08;render(now)});
  function fly(c,onT,done){st.auto=false;st.sel=c;st.t=0;const m=d3.geoInterpolate(A,[c.lon,c.lat])(.5),k1=Math.min(4,Math.max(1,70/(c.km/111.2+15)));const ri=d3.interpolate(st.rot.slice(),[-m[0],-m[1]]),ki=d3.interpolate(st.k,k1);
    if(RM){st.rot=[-m[0],-m[1]];st.k=k1;st.t=1;onT&&onT(1);done&&done();return}
    d3.select({}).transition().duration(1100).ease(d3.easeCubicInOut).tween("r",()=>t=>{st.rot=ri(t);st.k=ki(t)}).transition().duration(2600).ease(d3.easeSinInOut).tween("f",()=>t=>{st.t=t;onT&&onT(t)}).on("end",()=>done&&done())}
  function set(c){const m=d3.geoInterpolate(A,[c.lon,c.lat])(.5);st.rot=[-m[0],-m[1]];st.k=Math.min(4,Math.max(1,70/(c.km/111.2+15)));st.auto=false;st.sel=c;st.t=1}
  render(0);return{st,fly,set,labels};
}
const g1=Globe("#g1",{traffic:true,onPick:c=>{$("#explore").scrollIntoView();setTimeout(()=>pick(c),500)}});
const g2=Globe("#g2",{onPick:c=>pick(c)});
$("#go").onclick=()=>{$("#explore").scrollIntoView();setTimeout(()=>pick(C[0]),500)};

/* chips & tabs */
C.forEach(c=>{const b=document.createElement("button");b.className="chip";b.id="ch-"+c.id;b.onclick=()=>pick(c);$("#chips").append(b)});
const TK=["ov","cmp","rt","lg","id"];let cur=C.find(c=>c.id==="rennes"),tab="ov";
TK.forEach((k,i)=>{const b=document.createElement("button");b.className="tab";b.role="tab";b.id="t-"+k;b.onclick=()=>{tab=k;show()};$("#tabs").append(b)});
const ftime=km=>{const h=km/800;return h<1?Math.round(h*60)+" "+T[L].min:Math.floor(h)+" "+T[L].h+" "+Math.round((h%1)*60)+" "+T[L].min};
function passFill(c){const t=tx(c);C.forEach(x=>$("#ch-"+x.id).setAttribute("aria-pressed",x===c));$("#p-code").textContent=c.iata;$("#p-city").textContent=t.name;$("#p-country").textContent=t.country;$("#p-pop").textContent=t.popY;$("#p-lang").textContent=t.lname;$("#p-time").textContent=ftime(c.km);$("#p-km").textContent=fmt(c.km)+" "+T[L].km}
function pick(c){cur=c;passFill(c);const p=$("#pass");p.classList.remove("enter");void p.offsetWidth;p.classList.add("enter");tab="rt";show();
  g2.fly(c,t=>{$("#p-km").textContent=fmt(c.km*t)+" "+T[L].km;$("#fbar").style.width=t*100+"%";if(tab==="rt"&&$("#rkm")){$("#rkm").textContent=fmt(c.km*t)+" "+T[L].km;document.querySelectorAll(".steps li").forEach((li,i,a)=>li.classList.toggle("v",t>=i/(a.length-1)-.02))}},()=>{$("#p-km").textContent=fmt(c.km)+" "+T[L].km})}
function bar(l,v,m,txt,a){return`<div class="bar ${a?"a":""}"><span>${l}</span><i data-w="${Math.max(3,v/m*100)}"></i><span>${txt}</span></div>`}
const dec=n=>String(n).replace(".",L==="fr"?",":",");
function show(){const c=cur,t=tx(c),S=T[L];TK.forEach((k,i)=>{const b=$("#t-"+k);b.textContent=S.tabs[i];b.setAttribute("aria-selected",k===tab)});let h="";
 if(tab==="ov")h=`<div class="phs">${PH[c.id].ov.map(f=>fig(f,t.name)).join("")}</div><span class="badge ${c.warn?"warn":""}">${t.tag}</span><h3>${S.link}</h3><p>${t.link}</p><ul style="margin-top:6px">${t.coop.map(x=>`<li>${x}</li>`).join("")}</ul><h3>${S.special}</h3><p>${t.special}</p><h3>${S.hist}</h3><p>${t.hist}</p><h3>${S.geo}</h3><p>${t.geo} ${t.clim}</p>`;
 if(tab==="cmp"){const mp=Math.max(ALA.pop,c.pop),ma=Math.max(ALA.alt,c.alt);h=`<div class="crow"><small>${S.popL}</small>${bar(S.ala,ALA.pop,mp,"≈"+dec(2.3)+" "+S.mln,1)}${bar(t.name,c.pop,mp,"≈"+dec(c.pop)+" "+S.mln)}</div><div class="crow"><small>${S.altL}</small>${bar(S.ala,ALA.alt,ma,"≈800 m",1)}${bar(t.name,c.alt,ma,"≈"+c.alt+" m")}</div><div class="crow"><small>${S.latL}</small>${bar(S.ala,ALA.lat,60,dec(43.2)+"°",1)}${bar(t.name,c.lat,60,dec(c.lat.toFixed(1))+"°")}</div><div class="vs"><div><small>${S.nature}</small><p>${S.alaNat}<br>${t.name}: ${t.env}</p></div><div><small>${S.city}</small><p>${t.urban}</p></div><div><small>${S.sim}</small><p>${t.sim}</p></div><div><small>${S.dif}</small><p>${t.dif}</p></div></div>`}
 if(tab==="rt")h=`<h3>${S.rtH}${t.name}</h3><div class="big" id="rkm">${fmt(c.km)} ${S.km}</div><p style="margin-bottom:16px">${S.arc}</p><ul class="steps">${t.steps.map(s=>`<li class="v">${s}</li>`).join("")}</ul><button class="chip" id="again">${S.again}</button>`;
 if(tab==="lg"){const tr=c.tr[L==="fr"?"fr":"ru"];h=`<p>${t.note}</p><div class="flips">${c.ph.map((p,i)=>`<button class="flip" id="fl${i}"><div class="fi"><div class="fs"><small>${S.mean[i]}</small><span class="o" lang="${c.code}">${p}</span><span class="tap">${S.tap}</span></div><div class="fs b"><small>${S.pron}</small><span class="t">[${tr[i]}]</span><span class="say" id="sy${i}">${S.listen}</span></div></div></button>`).join("")}</div><p id="tts"></p>`}
 if(tab==="id"){const d=t.idea;h=`<h3>${d.t}</h3><div class="phs">${PH[c.id].id.map(f=>fig(f,t.name)).join("")}${fig(ALAPH,ALACAP[L])}</div><div class="isteps" style="margin-top:12px">${[d.what,d.why,d.prob,d.how].map((v,i)=>`<div class="istep" style="animation-delay:${i*.12}s"><b>${i+1}</b><div><small>${S.idS[i]}</small><p>${v}</p></div></div>`).join("")}</div>`}
 $("#tbody").innerHTML=`<div>${h}</div>`;
 if(tab==="cmp")requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll("#tbody .bar i").forEach(i=>i.style.width=i.dataset.w+"%")));
 if(tab==="rt")$("#again").onclick=()=>pick(c);
 if(tab==="lg")c.ph.forEach((p,i)=>{$("#fl"+i).onclick=()=>$("#fl"+i).classList.toggle("f");$("#sy"+i).onclick=e=>{e.stopPropagation();speak(p,c.code)}});}
let voices=[];function lv(){try{voices=speechSynthesis.getVoices()}catch(e){}}lv();try{speechSynthesis.onvoiceschanged=lv}catch(e){}
function speak(t,code){try{const v=voices.find(v=>v.lang.replace("_","-").startsWith(code.slice(0,2)));if(!v){$("#tts").textContent=T[L].noVoice;return}const u=new SpeechSynthesisUtterance(t);u.lang=code;u.voice=v;u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){$("#tts").textContent=T[L].noVoice}}

/* quiz */
let qi=0,sc=0;
function confetti(){const cv=$("#conf"),x=cv.getContext("2d");cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;const cols=["#ffb547","#ff6b5b","#4fd1c5","#eef3ff"];const P=d3.range(160).map(()=>({x:cv.width/2,y:cv.height/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,c:cols[Math.floor(Math.random()*4)],r:Math.random()*360,s:Math.random()*6+4}));let n=0;(function f(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=8;x.save();x.translate(p.x,p.y);x.rotate(p.r*Math.PI/180);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++n<160)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})()}
function quiz(){const z=$("#quiz"),S=T[L],QQ=Q[L];if(qi>=QQ.length){z.innerHTML=`<canvas id="conf"></canvas><div style="text-align:center"><p class="qmeta">${S.res}</p><div class="score">${sc}/${QQ.length}</div><p style="font-size:18px">${S.r[sc>=7?2:sc>=4?1:0]}</p><p style="margin-top:20px"><button class="btn" id="qr">${S.qAgain}</button></p></div>`;$("#qr").onclick=()=>{qi=0;sc=0;quiz()};if(sc>=4&&!RM)confetti();return}
 const [t,o,a]=QQ[qi];z.innerHTML=`<div class="qprog"><i style="width:${qi/QQ.length*100}%"></i></div><p class="qmeta">${S.qOf.replace("{a}",qi+1).replace("{b}",QQ.length).replace("{c}",sc)}</p><h3 style="font-size:22px;margin-top:8px">${t}</h3><div class="opts">${o.map((x,i)=>`<button class="opt" id="o${i}">${x}</button>`).join("")}</div>`;
 o.forEach((x,i)=>$("#o"+i).onclick=()=>{if(i===a)sc++;$("#o"+a).classList.add("ok");if(i!==a)$("#o"+i).classList.add("no");z.querySelectorAll(".opt").forEach(b=>b.disabled=true);setTimeout(()=>{qi++;quiz()},1200)})}

/* language */
function setLang(l){L=l;const S=T[l];document.documentElement.lang=l==="kz"?"kk":l;document.title=S.title;
 document.querySelectorAll("[data-i]").forEach(el=>el.innerHTML=S[el.dataset.i]);
 document.querySelectorAll("[data-il]").forEach(el=>el.innerHTML=S[el.dataset.il].map(x=>`<li>${x}</li>`).join(""));
 document.querySelectorAll("[data-sw]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sw===l));
 const ti=$("#title");ti.innerHTML="";ti.setAttribute("aria-label",S.title);const ws=S.title.split(" ");ws.forEach((w,wi)=>{const s=document.createElement("span");s.style.whiteSpace="nowrap";if(wi===ws.length-1)s.className="w2";[...w].forEach((ch,i)=>{const e=document.createElement("span");e.className="l";e.textContent=ch;e.style.animationDelay=(wi*3+i)*.05+"s";s.append(e)});ti.append(s);if(wi<ws.length-1)ti.append(" ")});
 C.forEach(c=>$("#ch-"+c.id).textContent=tx(c).name);g1.labels();g2.labels();
 $("#who").innerHTML=S.who.map((w,i)=>`<div><b>0${i+1}</b>${w}</div>`).join("");
 $("#survey").innerHTML=S.sv.map((t,i)=>`<div class="crow"><small>${t}</small><div class="bar"><span>≈</span><i style="width:${SV[i]}%"></i><span>≈${SV[i]} %</span></div></div>`).join("");
 passFill(cur);show();qi=0;sc=0;quiz();try{localStorage.setItem("lang",l)}catch(e){}}
document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{setLang(b.dataset.pick);$("#lp").hidden=true});
document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>setLang(b.dataset.sw));
let saved="ru";try{saved=localStorage.getItem("lang")||"ru"}catch(e){}
setLang(saved);g2.set(cur);$("#fbar").style.width="100%";

/* reveal + tilt */
if(!RM&&"IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove("pre");io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll(".rv").forEach(el=>{if(el.getBoundingClientRect().top>innerHeight){el.classList.add("pre");io.observe(el)}})}
const pass=$("#pass");if(matchMedia("(hover:hover)").matches&&!RM){pass.addEventListener("mousemove",e=>{const r=pass.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;pass.style.transform=`perspective(1200px) rotateY(${x*5}deg) rotateX(${-y*5}deg)`});pass.addEventListener("mouseleave",()=>pass.style.transform="")}
</script>
